# Manifest, frontmatter, and stale-link gate. Runs the same `make lint` a human runs
# locally, so CI and the workstation cannot drift.
name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PyYAML
        # The issue-form check parses .github/ISSUE_TEMPLATE, and the runner image lacks PyYAML.
        run: >-
          python3 -c 'import yaml' 2>/dev/null
          || python3 -m pip install --quiet pyyaml
          || python3 -m pip install --quiet --break-system-packages pyyaml
      - name: make lint
        run: make lint
