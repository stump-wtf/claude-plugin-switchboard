# Manifest, frontmatter, and stale-link gate. Runs the same `make lint` a human runs
# locally, so CI and the workstation cannot drift.
name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: make lint
        run: make lint
